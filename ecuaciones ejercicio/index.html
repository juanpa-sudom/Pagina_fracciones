<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="functions2.js"></script>
    <title>Quiz jejeje</title>
</head>
<body>

    <header>
        <h1>Ejercicio #2 Matemáticas</h1>
        <h2>Juan Pablo Muñoz C</h2>
    </header>

    <main>
        <div class="card">
            <div class="equation-box">
                <h1 id="ecuation">29 + 63X = 8 + 41X</h1>
            </div>

            <div class="options-container">
                <div class="option">
                    <div class="circle" onclick="ValidarRespuesta(0)">A</div>
                    <span class="number"></span>
                </div>
                <div class="option">
                    <div class="circle" onclick="ValidarRespuesta(1)">B</div>
                    <span class="number"></span>
                </div>
                <div class="option">
                    <div class="circle" onclick="ValidarRespuesta(2)">C</div>
                    <span class="number"></span>
                </div>
            </div>

            <div class="timer-container">
                <div class="timer-title">Timer</div>
                <div class="timer-clock"><h1 id="timer">0:00</h1></div>
            </div>
        </div>
    </main>

</body>
</html>
